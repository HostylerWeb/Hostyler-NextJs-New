services:
  postgres:
    image: postgres:16-alpine
    container_name: hostyler-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: hostyler
      POSTGRES_PASSWORD: hostyler
      POSTGRES_DB: hostyler
    volumes:
      - hostyler_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostyler -d hostyler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hostyler_pg_data:
